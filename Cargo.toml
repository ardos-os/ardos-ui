[package]
name = "ardos-ui"
version = "0.1.0"
edition = "2024"
[workspace]
members = ["ardos-ui-rsml-compiler"]
[dependencies]
skia-safe = { version = "0", features = [
    "gl", "svg", 
    # Didn't want to add this but it's just to stop skia-bindings from trying to compile skia from source
    "textlayout", "x11", "binary-cache"
]}
color-eyre = "0.6.3"
winit = { git = "https://github.com/SergioRibera/winit/", branch = "layer_shell", version = "0.31.0-beta.2", features = ["android-native-activity"] }
glutin = { git = "https://github.com/coffeeispower/glutin", version = "0.32.3" }
glutin-winit = { git = "https://github.com/coffeeispower/glutin", version = "0.5.0" }
log = "0.4.27"
ardos-ui-rsml-compiler = { path = "ardos-ui-rsml-compiler" }
uuid = { version = "1.18.1", features = ["v4"] }
bitflags = "2.12.1"

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
smithay-clipboard = "0.7.3"

[target.'cfg(target_os = "android")'.dependencies]
android_clipboard = "0.1.0"

[dependencies.rlay]
package = "rlay"
git = "https://github.com/ardos-os/rlay"

[dev-dependencies]
compile-time-run = "0.2.12"
env_logger = "0.11.8"
lucide-icons = "1.21.0"
